{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="card">

    <h1>Create Account</h1>

    <p>
        Create a student account to access the platform.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

    <hr>

    <p>
        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>
    </p>

</div>

{% endblock %}
