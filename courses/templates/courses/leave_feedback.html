{% extends 'base.html' %}

{% block title %}
Leave Feedback
{% endblock %}


{% block content %}

<div class="card">

    <h1>Leave Feedback</h1>

    <p>
        Course:
        <strong>{{ course.title }}</strong>
    </p>

    <p>
        Rate the course between 1 and 5 and leave a short comment.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Submit Feedback
        </button>

        <a
            class="button secondary-button"
            href="{% url 'course_detail' course.id %}"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
