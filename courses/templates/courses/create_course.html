{% extends 'base.html' %}

{% block title %}
Create Course
{% endblock %}


{% block content %}

<div class="card">

    <h1>Create Course</h1>

    <p>
        Enter the information for the new course.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Course
        </button>

    </form>

</div>

{% endblock %}
